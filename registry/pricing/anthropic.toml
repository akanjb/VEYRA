# Anthropic API prices, USD per 1M tokens (standard tier).
# Source: https://platform.claude.com/docs/en/about-claude/pricing (read 2026-11-08).
#
# Mapping: cache_write_short = 5-minute write, cache_write_long = 1-hour write,
#          cache_read = cache hits and refreshes.
# Modifiers (same page):
#   - Batch API: 50% off input and output; caching multipliers stack with batch, so
#     the 0.5 factor applies to every component.
#   - Fast mode (Opus 5.5, Opus 5, Opus 4.8): published at 2x standard input/output;
#     caching multipliers apply on top, so the 2.0 factor applies to every component.
#   - inference_geo "us": 1.1x on all token categories for Claude 4.6 and later models
#     (including Haiku 5.5, also on its >100k prices). Earlier models reject it.
#   - Long context: Claude 4.6+ (except Haiku 5.5) bill the full 1M context at standard
#     prices, so no prompt tiers. Haiku 5.5 has a >100,000-prompt-token tier.
# No published start dates: prices are assumed unchanged before verification
# (history_assumed), which the assumptions panel discloses.
# Not priced (not listed on the pricing page): claude-mythos-preview, claude-3-7-sonnet,
# claude-3-5-haiku, claude-3-haiku.

[defaults]
provider = "anthropic"
source_url = "https://platform.claude.com/docs/en/about-claude/pricing"
verified_at = "2026-11-08"
history_assumed = true

[[rule]]
id = "anthropic/fable-5-1"
models = ["claude-fable-5-1", "claude-mythos-5-1"]
rates = { input = 10.0, output = 50.0, cache_read = 0.25, cache_write_short = 12.5, cache_write_long = 20.0 }
modifiers = { batch = { factor = 0.5 }, inference_geo_us = 1.1 }

[[rule]]
id = "anthropic/opus-5-5"
models = ["claude-opus-5-5"]
rates = { input = 4.0, output = 20.0, cache_read = 0.20, cache_write_short = 5.0, cache_write_long = 8.0 }
modifiers = { batch = { factor = 0.5 }, fast = { factor = 2.0 }, inference_geo_us = 1.1 }

[[rule]]
id = "anthropic/sonnet-5-5"
models = ["claude-sonnet-5-5"]
rates = { input = 2.0, output = 10.0, cache_read = 0.10, cache_write_short = 2.5, cache_write_long = 4.0 }
modifiers = { batch = { factor = 0.5 }, inference_geo_us = 1.1 }

[[rule]]
id = "anthropic/haiku-5-5"
models = ["claude-haiku-5-5"]
rates = { input = 0.10, output = 0.50, cache_read = 0.01, cache_write_short = 0.125, cache_write_long = 0.20 }
tier = [
  { above_prompt_tokens = 100000, rates = { input = 0.50, output = 2.50, cache_read = 0.05, cache_write_short = 0.625, cache_write_long = 1.0 } },
]
modifiers = { batch = { factor = 0.5 }, inference_geo_us = 1.1 }

[[rule]]
id = "anthropic/fable-5"
models = ["claude-fable-5", "claude-mythos-5"]
rates = { input = 10.0, output = 50.0, cache_read = 1.0, cache_write_short = 12.5, cache_write_long = 20.0 }
modifiers = { batch = { factor = 0.5 }, inference_geo_us = 1.1 }

[[rule]]
id = "anthropic/opus-5-and-4-8"
models = ["claude-opus-5", "claude-opus-4-8"]
rates = { input = 5.0, output = 25.0, cache_read = 0.50, cache_write_short = 6.25, cache_write_long = 10.0 }
modifiers = { batch = { factor = 0.5 }, fast = { factor = 2.0 }, inference_geo_us = 1.1 }

[[rule]]
id = "anthropic/opus-4-7-and-4-6"
