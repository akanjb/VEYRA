# Workspace clippy configuration. Lint levels live in Cargo.toml [workspace.lints].

# Test code may unwrap/expect: a failure there is the test failing, which is intended.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Proper nouns that the pedantic `doc_markdown` lint would otherwise want in backticks.
doc-valid-idents = ["OpenAI", "OpenRouter", "OpenCode", "GitHub", "TypeScript", "SQLite", "WebView2", "..",]
