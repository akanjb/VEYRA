[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "tools/contracts-gen", "tools/perf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Veyra-Source-Available-1.0"
authors = ["Nikunj Bansal"]
publish = false

# Exact pins: every version was published at least a week before adoption
# (supply-chain policy, ADR-017). Cargo.lock is committed.
[workspace.dependencies]
veyra-analytics = { path = "crates/veyra-analytics" }
veyra-app = { path = "crates/veyra-app" }
veyra-connectors = { path = "crates/veyra-connectors" }
veyra-domain = { path = "crates/veyra-domain" }
veyra-ingest = { path = "crates/veyra-ingest" }
veyra-registry = { path = "crates/veyra-registry" }
veyra-store = { path = "crates/veyra-store" }
veyra-testkit = { path = "crates/veyra-testkit" }
jiff = "=0.2.38"
memchr = "=2.8.3"
notify = "=8.2.1"
ruzstd = "=0.9.1"
rusqlite = { version = "=0.41.1", features = ["backup", "bundled", "functions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
tauri = "=2.12.5"
tauri-build = "=2.7.4"
thiserror = "=2.0.21"
toml = "=1.1.8"
ts-rs = "=12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
